services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doc_home}
      POSTGRES_DB: ${POSTGRES_DB:-doc_home}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Development emulator only: AWS authentication and IAM are not enforced.
  object-storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: doc-home-assets
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - object_storage_data:/s3mockroot
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/favicon.ico']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

volumes:
  postgres_data:
  object_storage_data:
